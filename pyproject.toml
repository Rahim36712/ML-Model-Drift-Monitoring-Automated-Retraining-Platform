[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-drift-monitor"
version = "2.0.0"
description = "ML Model Drift Monitor & Automated Retraining Platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}

dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "mlflow==2.19.0",
    "scikit-learn==1.5.2",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "dash==2.18.2",
    "plotly==5.24.1",
    "dash-bootstrap-components==1.6.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "PyYAML==6.0.2",
    "python-dotenv==1.0.1",
    "SQLAlchemy==2.0.36",
    "requests==2.32.3",
    "httpx==0.28.1",
    "joblib==1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
"src.dashboard" = ["assets/*.css", "assets/*.svg"]
"src.config" = ["defaults/*.yaml"]

[project.scripts]
driftwatch = "scripts.run_demo:main"
