name: Verify showcase
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m ruff check src scripts tests --select E9,F63,F7,F82
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Verify complete running lifecycle
        run: docker compose exec -T driftwatch python -m scripts.smoke_test --timeout 600 --report /workspace/data/demo/ci-before.json
      - name: Verify restart persistence
        run: |
          docker compose restart
          docker compose exec -T driftwatch python -m scripts.smoke_test --check-only --timeout 300 --expect-snapshot /workspace/data/demo/ci-before.json --report /workspace/data/demo/ci-after.json
      - name: Collect verification evidence
        if: always()
        run: |
          mkdir -p ci-evidence
          docker compose cp driftwatch:/workspace/data/demo/ci-before.json ci-evidence/before.json || true
          docker compose cp driftwatch:/workspace/data/demo/ci-after.json ci-evidence/after.json || true
          docker compose logs --no-color > ci-evidence/services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lifecycle-evidence
          path: ci-evidence/
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
